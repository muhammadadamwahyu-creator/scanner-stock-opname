<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Scanner QR - Stock Opname</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 5px 0 10px;
      color: #222;
    }

    #status {
      margin: 10px auto;
      padding: 10px;
      max-width: 500px;
      color: #555;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #hasil {
      margin: 15px auto;
      padding: 15px;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #btnIzin {
      display: none;
      width: 100%;
      max-width: 500px;
      padding: 15px;
      margin: 10px auto;
      border: none;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<h2>📷 SCAN QR LOKASI</h2>


<div id="status">
  Memeriksa kamera...
</div>


<button
  id="btnIzin"
  onclick="mintaIzinKamera()">

  📷 IZINKAN KAMERA

</button>


<div id="reader"></div>


<div id="hasil">
  Arahkan kamera ke QR Code
</div>


<script>


/* =====================================================
   URL APLIKASI STOCK OPNAME
===================================================== */

var URL_APLIKASI =
  "https://script.google.com/macros/s/AKfycby7qagkOV4c9VflAoRYz_2xpngpopCwJhZsB__ux3UZqa2CLhWvUedNudA0cn9WyXkh/exec";


var scanner = null;

var sudahScan = false;


/* =====================================================
   TAMPILKAN STATUS
===================================================== */

function statusPesan(pesan) {

  document.getElementById("status").innerText = pesan;

}


/* =====================================================
   MINTA IZIN KAMERA
===================================================== */

function mintaIzinKamera() {

  statusPesan("Meminta izin kamera...");

  navigator.mediaDevices.getUserMedia({
    video: true
  })

  .then(function(stream) {

    /*
       Kamera berhasil mendapatkan izin.
       Matikan stream sementara.
    */

    stream.getTracks().forEach(function(track) {
      track.stop();
    });


    document.getElementById("btnIzin")
      .style.display = "none";


    mulaiScanner();

  })

  .catch(function(error) {

    console.error(error);

    statusPesan(
      "❌ Izin kamera ditolak atau kamera tidak tersedia."
    );

    document.getElementById("hasil").innerText =
      "Silakan izinkan akses kamera pada browser.";

    document.getElementById("btnIzin")
      .style.display = "block";

  });

}


/* =====================================================
   MULAI SCANNER
===================================================== */

function mulaiScanner() {

  statusPesan("Mencari kamera...");


  /*
     Ambil daftar kamera
  */

  Html5Qrcode.getCameras()

    .then(function(devices) {


      if (!devices || devices.length === 0) {

        statusPesan(
          "❌ Kamera tidak ditemukan."
        );

        document.getElementById("hasil").innerText =
          "HP tidak menemukan kamera.";

        return;

      }


      console.log("Jumlah kamera:", devices.length);


      /*
         Pilih kamera.
         Biasanya kamera belakang berada
         pada device terakhir atau memiliki
         label back/rear/environment.
      */

      var kameraDipilih = devices[0];


      for (var i = 0; i < devices.length; i++) {

        var label =
          String(devices[i].label || "")
            .toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          kameraDipilih = devices[i];

          break;

        }

      }


      console.log(
        "Kamera digunakan:",
        kameraDipilih
      );


      scanner =
        new Html5Qrcode("reader");


      var config = {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          var ukuran =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;


          return {
            width: ukuran,
            height: ukuran
          };

        },

        aspectRatio: 1.0

      };


      statusPesan(
        "Mengaktifkan kamera..."
      );


      scanner.start(

        kameraDipilih.id,

        config,


        function(decodedText) {


          if (sudahScan) {
            return;
          }


          sudahScan = true;


          hasilScan(decodedText);


        },


        function(errorMessage) {

          /*
             Error saat belum menemukan QR
             sengaja tidak ditampilkan.
          */

        }

      )

      .then(function() {

        statusPesan(
          "✅ Kamera aktif — arahkan ke QR Code"
        );


        document.getElementById("hasil")
          .innerText =
          "Arahkan kamera ke QR Code";


      })

      .catch(function(error) {

        console.error(error);


        statusPesan(
          "❌ Kamera gagal dibuka."
        );


        document.getElementById("hasil")
          .innerText =
          "Tidak dapat menggunakan kamera.";


        document.getElementById("btnIzin")
          .style.display = "block";

      });


    })

    .catch(function(error) {

      console.error(error);


      statusPesan(
        "❌ Tidak dapat mengakses kamera."
      );


      document.getElementById("hasil")
        .innerText =
        "Browser belum memberikan izin kamera.";


      document.getElementById("btnIzin")
        .style.display = "block";

    });

}


/* =====================================================
   QR BERHASIL DIBACA
===================================================== */

function hasilScan(kode) {


  kode =
    String(kode)
      .trim()
      .toUpperCase();


  document.getElementById("hasil")
    .innerText =
    "✅ QR TERBACA: " + kode;


  statusPesan(
    "Mengirim hasil scan..."
  );


  /*
     Hentikan kamera
  */

  if (scanner) {

    scanner.stop()

      .then(function() {

        kembaliKeAplikasi(kode);

      })

      .catch(function(error) {

        console.error(error);

        kembaliKeAplikasi(kode);

      });

  }

  else {

    kembaliKeAplikasi(kode);

  }

}


/* =====================================================
   KEMBALI KE APLIKASI
===================================================== */

function kembaliKeAplikasi(kode) {


  var urlKembali =
    URL_APLIKASI +
    "?qr=" +
    encodeURIComponent(kode);


  /*
     replace agar scanner tidak masuk
     kembali saat tombol BACK ditekan.
  */

  window.location.replace(urlKembali);

}


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
  "load",
  function() {

    /*
       Coba langsung mencari kamera.
    */

    if (
      navigator.mediaDevices &&
      navigator.mediaDevices.getUserMedia
    ) {

      mulaiScanner();

    }

    else {

      statusPesan(
        "❌ Browser tidak mendukung akses kamera."
      );

      document.getElementById("hasil")
        .innerText =
        "Gunakan Chrome Android versi terbaru.";

    }

  }
);


</script>


</body>

</html>
