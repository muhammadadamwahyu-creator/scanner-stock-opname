<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Stock Opname</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 24px;
    }

    h2 {
      text-align: center;
      margin: 0 0 20px;
      font-size: 17px;
      color: #666;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    #status {
      margin: 15px 0;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      background: #fff3cd;
      color: #664d03;
      font-weight: bold;
    }

    .success {
      background: #d1e7dd !important;
      color: #0f5132 !important;
    }

    .error {
      background: #f8d7da !important;
      color: #842029 !important;
    }

    .loading {
      background: #fff3cd !important;
      color: #664d03 !important;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #198754;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    #hasil {
      margin-top: 15px;
      padding: 12px;
      background: #eaf4ff;
      border-radius: 8px;
      word-break: break-all;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="judulScanner">📷 SCANNER</h1>

  <h2>STOCK OPNAME SAMUDRA</h2>

  <div id="status">
    Memeriksa kamera...
  </div>

  <div class="card">

    <div id="reader"></div>

    <div id="hasil"></div>

    <button id="btnKamera" onclick="mulaiKamera()">
      📷 IZINKAN KAMERA
    </button>

  </div>

</div>


<script>

  // =========================================================
  // KONFIGURASI
  // =========================================================

  var URL_APLIKASI =
    "https://script.google.com/macros/s/AKfycbyMlfTW4TS3LYOKdqkq7OeHQmF5wI-6JekoXEC1wwO8LirU_Cw78I-F7ELjMkXwtROE/exec";


  // =========================================================
  // TENTUKAN MODE
  // =========================================================

  var parameterURL = new URLSearchParams(window.location.search);

  var mode = parameterURL.get("mode");

  if (mode !== "produk") {
    mode = "lokasi";
  }


  // =========================================================
  // UBAH JUDUL SESUAI MODE
  // =========================================================

  window.addEventListener("load", function() {

    if (mode === "produk") {

      document.getElementById("judulScanner").innerText =
        "📷 SCAN BARCODE BARANG";

      document.getElementById("status").innerText =
        "Arahkan kamera ke barcode produk.";

    } else {

      document.getElementById("judulScanner").innerText =
        "📷 SCAN QR NO. LOKASI";

      document.getElementById("status").innerText =
        "Arahkan kamera ke QR Code lokasi.";
    }

    // Langsung mulai kamera
    setTimeout(function() {
      mulaiKamera();
    }, 500);

  });


  // =========================================================
  // VARIABEL SCANNER
  // =========================================================

  var scanner = null;
  var sedangScan = false;


  // =========================================================
  // MULAI KAMERA
  // =========================================================

  function mulaiKamera() {

    if (sedangScan) {
      return;
    }

    if (typeof Html5Qrcode === "undefined") {

      tampilStatus(
        "❌ Library scanner belum berhasil dimuat.",
        "error"
      );

      return;
    }

    tampilStatus(
      "📷 Meminta izin kamera...",
      "loading"
    );

    scanner = new Html5Qrcode("reader");

    var config = {
      fps: 10,
      qrbox: {
        width: 280,
        height: 150
      },
      aspectRatio: 1.777778
    };


    scanner.start(
      {
        facingMode: "environment"
      },
      config,
      function(decodedText, decodedResult) {

        hasilScan(decodedText);

      },
      function(errorMessage) {

        // Jangan tampilkan error scan kecil.
        // Scanner tetap berjalan.
      }
    )
    .then(function() {

      sedangScan = true;

      document.getElementById("btnKamera").disabled = true;

      tampilStatus(
        "✅ Kamera aktif. Arahkan ke kode.",
        "success"
      );

    })
    .catch(function(error) {

      console.error(error);

      sedangScan = false;

      tampilStatus(
        "❌ Kamera tidak dapat digunakan. Pastikan izin kamera diberikan.",
        "error"
      );

      document.getElementById("btnKamera").disabled = false;

    });

  }


  // =========================================================
  // HASIL SCAN
  // =========================================================

  function hasilScan(kode) {

    if (!kode) {
      return;
    }

    kode = String(kode).trim();

    if (kode === "") {
      return;
    }


    // Mencegah scan berulang
    if (!sedangScan) {
      return;
    }

    sedangScan = false;


    tampilStatus(
      "✅ Kode berhasil dibaca.",
      "success"
    );


    document.getElementById("hasil").style.display = "block";

    document.getElementById("hasil").innerHTML =
      "<strong>Hasil Scan:</strong><br>" +
      escapeHtml(kode);


    // Matikan kamera terlebih dahulu
    if (scanner) {

      scanner.stop()
        .then(function() {

          scanner.clear();

          lanjutKeAplikasi(kode);

        })
        .catch(function() {

          lanjutKeAplikasi(kode);

        });

    } else {

      lanjutKeAplikasi(kode);

    }

  }


  // =========================================================
  // KEMBALI KE APLIKASI STOCK OPNAME
  // =========================================================

  function lanjutKeAplikasi(kode) {

    var tujuan = "";


    // ---------------------------------------------------------
    // MODE LOKASI
    // ---------------------------------------------------------

    if (mode === "lokasi") {

      tujuan =
        URL_APLIKASI +
        "?qr=" +
        encodeURIComponent(kode);

    }


    // ---------------------------------------------------------
    // MODE PRODUK
    // ---------------------------------------------------------

    else {

      tujuan =
        URL_APLIKASI +
        "?barcode=" +
        encodeURIComponent(kode);

    }


    tampilStatus(
      "⏳ Membuka aplikasi Stock Opname...",
      "loading"
    );


    setTimeout(function() {

      window.location.href = tujuan;

    }, 500);

  }


  // =========================================================
  // STATUS
  // =========================================================

  function tampilStatus(pesan, tipe) {

    var el = document.getElementById("status");

    el.innerText = pesan;

    el.className = "";

    if (tipe) {
      el.classList.add(tipe);
    }

  }


  // =========================================================
  // KEAMANAN TAMPILAN HASIL
  // =========================================================

  function escapeHtml(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
