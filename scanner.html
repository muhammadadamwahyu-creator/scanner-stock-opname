<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Scanner Stock Opname</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      margin: 5px 0 10px;
      color: #222;
    }

    #status {
      margin: 10px auto;
      padding: 12px;
      max-width: 500px;
      color: #555;
      background: white;
      border-radius: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #hasil {
      margin: 15px auto;
      padding: 15px;
      max-width: 500px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #btnKamera {
      display: none;
      width: 100%;
      max-width: 500px;
      padding: 15px;
      margin: 10px auto;
      border: none;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h2 id="judul">📷 SCANNER</h2>

  <div id="status">
    Menyiapkan kamera...
  </div>

  <button
    id="btnKamera"
    onclick="mintaIzinKamera()">
    📷 IZINKAN KAMERA
  </button>

  <div id="reader"></div>

  <div id="hasil">
    Menunggu kamera...
  </div>

  <div class="footer">
    ~@djie Muhammad ~
  </div>

</div>

<script>

/* =====================================================
   URL APLIKASI STOCK OPNAME
===================================================== */

var URL_APLIKASI =
"https://script.google.com/macros/s/AKfycbyMlfTW4TS3LYOKdqkq7OeHQmF5wI-6JekoXEC1wwO8LirU_Cw78I-F7ELjMkXwtROE/exec";


/* =====================================================
   TENTUKAN MODE SCANNER
===================================================== */

var parameter =
new URLSearchParams(window.location.search);

var mode =
parameter.get("mode");

var scanner = null;

var sudahScan = false;


/* =====================================================
   JIKA MODE PRODUK
===================================================== */

if (mode === "produk") {

  document.getElementById("judul").innerText =
    "📷 SCAN BARCODE BARANG";

  document.getElementById("hasil").innerText =
    "Arahkan kamera ke barcode barang";

}


/* =====================================================
   JIKA MODE LOKASI
===================================================== */

else {

  mode = "lokasi";

  document.getElementById("judul").innerText =
    "📷 SCAN QR NO. LOKASI";

  document.getElementById("hasil").innerText =
    "Arahkan kamera ke QR lokasi";

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(pesan) {

  document.getElementById("status").innerText =
    pesan;

}


/* =====================================================
   MINTA IZIN KAMERA
===================================================== */

function mintaIzinKamera() {

  setStatus("Meminta izin kamera...");

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      "❌ Browser tidak mendukung kamera."
    );

    return;
  }


  navigator.mediaDevices.getUserMedia({

    video: {
      facingMode: {
        ideal: "environment"
      }
    },

    audio: false

  })

  .then(function(stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    document.getElementById("btnKamera")
      .style.display = "none";


    setStatus(
      "Izin kamera berhasil."
    );


    mulaiScanner();

  })

  .catch(function(error) {

    console.error(error);

    setStatus(
      "❌ Kamera tidak diizinkan."
    );

    document.getElementById("hasil").innerText =
      "Silakan izinkan kamera.";

    document.getElementById("btnKamera")
      .style.display = "block";

  });

}


/* =====================================================
   MULAI SCANNER
===================================================== */

function mulaiScanner() {

  setStatus(
    "Mencari kamera belakang..."
  );


  Html5Qrcode.getCameras()

  .then(function(devices) {

    if (
      !devices ||
      devices.length === 0
    ) {

      setStatus(
        "❌ Kamera tidak ditemukan."
      );

      return;
    }


    var kamera =
      devices[0];


    for (
      var i = 0;
      i < devices.length;
      i++
    ) {

      var label =
        String(
          devices[i].label || ""
        ).toLowerCase();


      if (
        label.indexOf("back") !== -1 ||
        label.indexOf("rear") !== -1 ||
        label.indexOf("environment") !== -1
      ) {

        kamera =
          devices[i];

        break;

      }

    }


    scanner =
      new Html5Qrcode("reader");


    var config = {

      fps: 10,

      qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        var ukuran =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.70;


        return {

          width: ukuran,

          height: ukuran

        };

      },

      aspectRatio: 1.0

    };


    setStatus(
      "Membuka kamera..."
    );


    scanner.start(

      kamera.id,

      config,

      function(decodedText) {

        if (sudahScan) {

          return;

        }


        sudahScan = true;


        prosesHasilScan(
          decodedText
        );

      },

      function(errorMessage) {

        // Abaikan error scan sementara

      }

    )

    .then(function() {

      if (mode === "produk") {

        setStatus(
          "✅ Kamera aktif — arahkan ke barcode barang"
        );

        document.getElementById("hasil").innerText =
          "Arahkan kamera ke barcode barang";

      }

      else {

        setStatus(
          "✅ Kamera aktif — arahkan ke QR lokasi"
        );

        document.getElementById("hasil").innerText =
          "Arahkan kamera ke QR lokasi";

      }

    })

    .catch(function(error) {

      console.error(error);

      setStatus(
        "❌ Kamera gagal dibuka."
      );

      document.getElementById("hasil").innerText =
        "Kamera gagal dibuka.";

      document.getElementById("btnKamera")
        .style.display = "block";

    });

  })

  .catch(function(error) {

    console.error(error);

    setStatus(
      "❌ Tidak dapat mengambil kamera."
    );

    document.getElementById("hasil").innerText =
      "Akses kamera belum diberikan.";

    document.getElementById("btnKamera")
      .style.display = "block";

  });

}


/* =====================================================
   HASIL SCAN
===================================================== */

function prosesHasilScan(kode) {

  kode =
    String(kode).trim();


  document.getElementById("hasil").innerText =
    "✅ TERBACA: " + kode;


  setStatus(
    "Mengirim hasil scan..."
  );


  /* =================================================
     MODE BARCODE PRODUK
  ================================================= */

  if (mode === "produk") {

    var urlKembali =
      URL_APLIKASI +
      "?barcode=" +
      encodeURIComponent(kode);


    kirimKeAplikasi(
      urlKembali
    );


    return;
  }


  /* =================================================
     MODE QR LOKASI
  ================================================= */

  var urlKembali =
    URL_APLIKASI +
    "?qr=" +
    encodeURIComponent(kode);


  kirimKeAplikasi(
    urlKembali
  );

}


/* =====================================================
   KEMBALI KE APLIKASI
===================================================== */

function kirimKeAplikasi(url) {

  if (scanner) {

    scanner.stop()

    .then(function() {

      window.location.replace(
        url
      );

    })

    .catch(function(error) {

      console.error(error);

      window.location.replace(
        url
      );

    });

  }

  else {

    window.location.replace(
      url
    );

  }

}


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
  "load",
  function() {

    mintaIzinKamera();

  }
);

</script>

</body>
</html>
